<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- الوضع قبل أول رسم: داكن في الوسم نفسه (الافتراضي، ولو تعطّل JavaScript)، وهذا السطر يقرأ اختيار الزائر
         فلا تومض الصفحة داكنةً ثم فاتحة. المفتاح نفسه في src/lib/theme.js — غيّرهما معاً.
         لا يتبع إعداد النظام: الداكن هو البداية حتى يختار المستخدم غيره. -->
    <script>
      try {
        if (localStorage.getItem("muthbit.theme") === "light") document.documentElement.setAttribute("data-theme", "light");
      } catch (e) {}
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />
    <!-- القيمة حرفية اضطراراً: theme-color يقرأه كروم المتصفح لا CSS، فلا يقبل var().
         هذا الاستثناء الوحيد لقاعدة «لا #RRGGBB داخل apps/web»، ومصدره --mb-seal. -->
    <meta name="theme-color" content="#0B4F4A" />
    <!-- في الملف لا في الصفحة: معاينات الروابط تقرأ HTML الخام ولا تشغّل JavaScript. -->
    <title>مثبت — منصة مشتريات موثّقة للشركات السعودية</title>
    <meta
      name="description"
      content="مثبت تضع سقف الإنفاق لكل مشترٍ، وتُلزم كل طلب بموافقة من غير صاحبه، وتكتب كل خطوة في سجل لا يقبل التعديل — وتفتح الباب لموردين لا يظهرون قبل التحقق منهم."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
