name: CI

# الفحوص تعمل على كل دفع إلى main وعلى كل طلب دمج.
# النشر على Render لا يقع إلا بعد نجاحها كلها، وعلى main وحده.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: الفحوص والبناء
    # مثبّت لا latest: ubuntu-latest ينتقل إلى 26.04 من تلقاء نفسه، فيتغيّر ما تحت الفحوص
    # بلا التزام يشرح سقوطها. الانتقال إلى إصدار أحدث قرارٌ بالتزام، لا مفاجأة.
    runs-on: ubuntu-24.04

    # قاعدة بيانات مؤقتة تُنشأ مع كل تشغيل وتُهدم بعده.
    # لا صلة لها بقاعدة الإنتاج، ولا سرّ حقيقي في هذا الملف إطلاقاً.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: muthbit
          POSTGRES_PASSWORD: muthbit_ci
          POSTGRES_DB: muthbit_ci
        ports:
          - 5432:5432
        # لا تبدأ الخطوات قبل أن تردّ القاعدة فعلاً — وإلا سقطت المهاجرة بلا سبب مفهوم.
        options: >-
          --health-cmd "pg_isready -U muthbit -d muthbit_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://muthbit:muthbit_ci@127.0.0.1:5432/muthbit_ci
      # بوستجرس المحلي في CI بلا SSL. بدون هذا السطر يحاول knexfile الاتصال مشفّراً فيفشل.
      PGSSL: 'false'
      NODE_ENV: test
      # قيمة اختبار ثابتة لا تُستعمل خارج CI. مفتاح الإنتاج لا يمر من هنا إطلاقاً.
      JWT_SECRET: ci-not-a-real-secret
      # كلمة مرور حسابات البذور في هذه القاعدة المؤقتة وحدها: البذور تُنشئها بها، والفحوص تدخل بها.
      # بدونها تبذر البذور بكلمة عشوائية وترفض الفحوص العمل — وهذا ما أسقط CI منذ 752df34.
      # قيمة اختبار تحقّق سياسة كلمة المرور، ولا صلة لها بالإنتاج ولا بـ muthbit_dev.
      SEED_PASSWORD: Ci-Seed#2026

    steps:
      - name: جلب الشيفرة
        uses: actions/checkout@v7

      - name: تهيئة Node 24
        uses: actions/setup-node@v7
        with:
          # مثبّت عمداً كما ubuntu-24.04: خط رئيسي واحد يأخذ تحديثاته الأمنية ولا ينتقل وحده إلى غيره.
          # يطابق .node-version في الجذر (يقرؤه Render للخدمتين) و engines في package.json —
          # والثلاثة تتغيّر معاً في التزام واحد.
          node-version: '24'
          cache: npm

      - name: تثبيت الاعتماديات
        run: npm ci

      - name: فحص ثغرات الحزم
        # يسقط الفحص على high و critical وحدهما. moderate وأقل تظهر في السجل ولا توقف النشر،
        # وإلا صار الفحص ضجيجاً يُتجاوَز بالعادة لا بالقرار.
        # --omit=dev: اعتماديات الإنتاج وحدها (ما يصل الخادم والمتصفح). سلسلة tailwindcss 3 للبناء
        # فيها high لا يُصلح إلا بالترقية إلى tailwindcss 4 — حين تتم، تُحذف هذه الراية.
        run: npm audit --omit=dev --audit-level=high

      - name: إنشاء الجداول
        run: npm run api:migrate

      - name: البيانات التجريبية
        run: npm run api:seed

      - name: فحوص الخادم
        run: npm run api:test

      - name: بناء الواجهة
        # NODE_ENV=production لهذه الخطوة وحدها: مع test تبني Vite نسخة React التطويرية
        # (٦٠٩ ك.ب بدل ٣٥٤)، فيصير الفحص على حزمة غير التي تُنشر.
        env:
          NODE_ENV: production
        run: npm run web:build

      # ---------- النشر ----------
      # يقع بعد نجاح كل ما سبق (الخطوة لا تُنفَّذ إن سقطت خطوة قبلها)،
      # وعلى دفع إلى main وحده — لا على طلبات الدمج.
      # وإن لم يُضبط السرّ، تتخطّى الخطوة نفسها ولا تُسقط CI — لكن بتحذير ظاهر في ملخّص التشغيل لا بصمت.
      - name: نشر الخادم على Render
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            # ::warning:: يظهر في ملخّص التشغيل: ✓ الخطوة وحده لا يعني أن النشر وقع.
            echo "::warning title=لم يُنشر الخادم::السرّ RENDER_API_DEPLOY_HOOK غير مضبوط — تخطّي نشر الخادم."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$HOOK" > /dev/null
          echo "أُرسل طلب نشر الخادم إلى Render."

      - name: نشر الواجهة على Render
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HOOK: ${{ secrets.RENDER_WEB_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning title=لم تُنشر الواجهة::السرّ RENDER_WEB_DEPLOY_HOOK غير مضبوط — تخطّي نشر الواجهة."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$HOOK" > /dev/null
          echo "أُرسل طلب نشر الواجهة إلى Render."
